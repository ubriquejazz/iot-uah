<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT, MUIE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.2/mqttws31.min.js" type="text/javascript"></script>
    <script src="functions.js" type="text/javascript"></script>
</head>
<body>
    <h1>Lectura de sensores</h1>
    <table>
        <tr>
            <td>Temperatura:</td>
            <td id="temperatura">27 &ordm;C</td>
            <td>
                <table>
                    <tr><td id="temp" style="height:10px; background-color:#FF0000">.</td></tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>Corriente:</td>
            <td id="iluminacion">30 mA</td>
            <td id="ilu" style="width:200px; background-color:#00FF00"></td>            
        </tr>
   </table>
   <br><br><br>
   <input type="button" class="button_large" onclick="startConnect()" value="Conectar">
   <input type="button" class="button_large" onclick="startDisconnect()" value="Desconectar">
   <textarea rows="1" class="areaoftext" id="boilerStatus" disabled></textarea>
   <br>
   <div id="messages"></div>
</body>
</html>
